name: Studio Hourly Sync & Lifecycle Emails

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Google Calendar Edits & Cancellations
        run: curl -fsS "https://lizwendybeautystudiollc.com/.netlify/functions/sync-calendar"

      - name: Process Lifecycle Reminder & Review Emails
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" \
            "https://lizwendybeautystudiollc.com/.netlify/functions/lifecycle-emails"
